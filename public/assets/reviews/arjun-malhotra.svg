    <path d="M52 80 C54 97, 66 108, 80 108 C94 108, 106 97, 108 80 C104 91, 94 98, 80 98 C66 98, 56 91, 52 80 Z" fill="#1E222B" opacity="0.82"/>
    <path d="M68 88 Q80 84 92 88" stroke="#14171F" stroke-width="3" stroke-linecap="round" fill="none"/>
