<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Arjun Malhotra portrait">
  <defs>
    <linearGradient id="bg-arjun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05284D"/>
      <stop offset="100%" stop-color="#031D3D"/>
    </linearGradient>
    <radialGradient id="glow-arjun" cx="25%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FCB017" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FCB017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin-arjun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D99B6E"/>
      <stop offset="100%" stop-color="#BF7F52"/>
    </linearGradient>
    <clipPath id="clip-arjun">
      <circle cx="80" cy="80" r="76"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="78" fill="#FCB017"/>
