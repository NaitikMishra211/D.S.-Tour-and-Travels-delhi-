<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Neha Verma portrait">
  <defs>
    <linearGradient id="bg-neha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031D3D"/>
      <stop offset="55%" stop-color="#083D73"/>
      <stop offset="100%" stop-color="#05284D"/>
    </linearGradient>
    <radialGradient id="glow-neha" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FCB017" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FCB017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin-neha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCA074"/>
      <stop offset="100%" stop-color="#C48357"/>
    </linearGradient>
    <clipPath id="clip-neha">
      <circle cx="80" cy="80" r="76"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="78" fill="#FCB017"/>
  <g clip-path="url(#clip-neha)">
    <rect width="160" height="160" fill="url(#bg-neha)"/>
    <rect width="160" height="160" fill="url(#glow-neha)"/>
    <!-- Shoulder-length Dark Hair -->
    <path d="M42 66 C38 96, 40 128, 48 154 L112 154 C120 128, 122 96, 118 66 Z" fill="#181A20"/>
    <!-- Golden-Amber & Royal Navy Kurta with Dupatta -->
    <path d="M24 162 C30 126, 54 116, 80 116 C106 116, 130 126, 136 162 Z" fill="#0E4E8E"/>
    <path d="M36 162 C44 130, 62 120, 80 120 C98 120, 116 130, 124 162 Z" fill="#FCB017"/>
    <!-- Neck -->
    <rect x="69" y="96" width="22" height="24" rx="9" fill="#C48357"/>
    <!-- Gold Stud Earrings -->
    <circle cx="50" cy="82" r="3.5" fill="#FCB017"/>
    <circle cx="110" cy="82" r="3.5" fill="#FCB017"/>
    <!-- Head -->
    <path d="M52 67 C52 44, 108 44, 108 67 C108 94, 95 107, 80 107 C65 107, 52 94, 52 67 Z" fill="url(#skin-neha)"/>
    <!-- Hair Front -->
    <path d="M48 70 C47 42, 63 32, 80 32 C97 32, 113 42, 112 70 C105 53, 94 46, 80 45 C66 46, 55 53, 48 70 Z" fill="#181A20"/>
    <!-- Small Bindi -->
    <circle cx="80" cy="60" r="2" fill="#B91C1C"/>
    <!-- Eyebrows & Eyes -->
    <path d="M59 65 Q66 61 73 64" stroke="#181A20" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M87 64 Q94 61 101 65" stroke="#181A20" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="66" cy="71" rx="3.5" ry="2.8" fill="#181A20"/>
    <ellipse cx="94" cy="71" rx="3.5" ry="2.8" fill="#181A20"/>
    <circle cx="67" cy="70" r="1" fill="#FFFFFF"/>
    <circle cx="95" cy="70" r="1" fill="#FFFFFF"/>
    <!-- Nose -->
    <path d="M80 71 L79 82 Q80 84 82 82" stroke="#9E6238" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Warm Smile -->
    <path d="M70 90 Q80 97 90 90" stroke="#991B1B" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M73 91 Q80 95 87 91" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
