<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Rajesh Sharma portrait">
  <defs>
    <linearGradient id="bg-rajesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05284D"/>
      <stop offset="55%" stop-color="#083D73"/>
      <stop offset="100%" stop-color="#0E4E8E"/>
    </linearGradient>
    <radialGradient id="glow-rajesh" cx="75%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#FCB017" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FCB017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin-rajesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D79A6C"/>
      <stop offset="100%" stop-color="#BE7F52"/>
    </linearGradient>
    <clipPath id="clip-rajesh">
      <circle cx="80" cy="80" r="76"/>
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="78" fill="#FCB017"/>
  <g clip-path="url(#clip-rajesh)">
    <rect width="160" height="160" fill="url(#bg-rajesh)"/>
    <rect width="160" height="160" fill="url(#glow-rajesh)"/>
    <!-- Shoulders & Navy Blazer -->
    <path d="M22 162 C26 124, 52 114, 80 114 C108 114, 134 124, 138 162 Z" fill="#031D3D"/>
    <!-- Light Blue Shirt & Gold Tie -->
    <path d="M62 115 L80 148 L98 115 Z" fill="#E6F0FA"/>
    <path d="M76 122 L84 122 L86 156 L74 156 Z" fill="#FCB017"/>
    <!-- Lapels -->
    <path d="M56 115 L75 150 L62 155 L46 124 Z" fill="#062B54"/>
    <path d="M104 115 L85 150 L98 155 L114 124 Z" fill="#062B54"/>
    <!-- Neck -->
    <rect x="67" y="96" width="26" height="24" rx="10" fill="#C48457"/>
    <!-- Ears -->
    <ellipse cx="49" cy="76" rx="6" ry="10" fill="#C48457"/>
    <ellipse cx="111" cy="76" rx="6" ry="10" fill="#C48457"/>
    <!-- Head -->
    <path d="M50 66 C50 42, 110 42, 110 66 C110 95, 96 108, 80 108 C64 108, 50 95, 50 66 Z" fill="url(#skin-rajesh)"/>
    <!-- Neatly Groomed Indian Hair -->
    <path d="M48 68 C45 44, 60 32, 82 32 C103 32, 114 44, 112 68 C110 54, 102 46, 88 46 C70 46, 56 50, 48 68 Z" fill="#1A1D24"/>
    <!-- Eyebrows -->
    <path d="M59 65 Q67 61 74 64" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M86 64 Q93 61 101 65" stroke="#1A1D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="67" cy="71" rx="3.5" ry="2.8" fill="#1A1D24"/>
    <ellipse cx="93" cy="71" rx="3.5" ry="2.8" fill="#1A1D24"/>
    <circle cx="68" cy="70" r="1" fill="#FFFFFF"/>
    <circle cx="94" cy="70" r="1" fill="#FFFFFF"/>
    <!-- Nose -->
    <path d="M80 71 L78 83 Q80 85 83 83" stroke="#A66A3F" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Groomed Beard & Mustache -->
    <path d="M52 82 C54 98, 66 108, 80 108 C94 108, 106 98, 108 82 C104 92, 94 99, 80 99 C66 99, 56 92, 52 82 Z" fill="#22262F" opacity="0.88"/>
    <path d="M67 89 Q80 84 93 89 Q80 91 67 89 Z" fill="#1A1D24"/>
    <!-- Warm Smile -->
    <path d="M70 91 Q80 97 90 91" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
